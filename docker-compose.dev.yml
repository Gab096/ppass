version: '3.8'

services:
  # Aplicação AdonisJS em modo desenvolvimento
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: p-pass-app-dev
    restart: unless-stopped
    ports:
      - "${PORT:-3333}:3333"
    environment:
      NODE_ENV: development
      PORT: 3333
      HOST: 0.0.0.0
      APP_KEY: ${APP_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-p_pass}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - p-pass-network
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  # Banco de dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: p-pass-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-p_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - p-pass-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  p-pass-network:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local

