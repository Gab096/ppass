services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: p-pass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-p_pass}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - p-pass-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Scheduler para jobs agendados (check-out automático)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: p-pass-scheduler
    restart: unless-stopped
    # Usar init para permitir que o cron funcione corretamente
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_KEY: ${APP_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3333
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_DATABASE: ${DB_DATABASE:-p_pass}
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - p-pass-network
    volumes:
      - scheduler_logs:/var/log
    # O entrypoint já inicia o cron, não precisa de command

networks:
  p-pass-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  scheduler_logs:
    driver: local
